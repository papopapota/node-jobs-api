name: CI/CD Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Job 1: test
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run unit & integration tests
        env:
          node_env: test
          jwt_secret: testsecret
        run: |
          npm test
          npm run test:coverage
  # Job 2: Construir y subir imagen
  build:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push RELEASE
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          #  pushear el tag específico Y 'latest'
          tags: |
            papopapota/jobs-api:${{ github.ref_name }}
            papopapota/jobs-api:latest

  # Job 3: Desplegar (Solo corre si 'build' fue exitoso)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            #variables de entorno
            export MONGO_URI=${{ secrets.MONGO_URI }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export JWT_LIFETIME=${{ secrets.JWT_LIFETIME }}
            export PORT=${{ secrets.PORT }}
            export TRADERMADE_API_KEY=${{ secrets.TRADERMADE_API_KEY }}

            cd ~/apps/jobs-api

            #guardamos la version actual
            PREVIOUS_IMAGE=$(grep "image: papopapota/jobs-api" docker-compose.yml | awk '{print $2}')
            echo "Versión actual: $PREVIOUS_IMAGE"

            # Actualizamos la versión en el docker-compose
            sed -i "s|image: papopapota/jobs-api:.*|image: papopapota/jobs-api:${{ github.ref_name }}|" docker-compose.yml
            
            # Bajamos la nueva imagen
            docker compose pull jobs-api
            
            # Recreamos solo el contenedor que cambió
            docker compose up -d jobs-api

            #healthcheck
            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' jobs-api-jobs-api-1 2>/dev/null || echo "starting")
              echo "Health: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo " App is healthy"

                # Limpieza opcional de imágenes viejas para no llenar el disco
                docker image prune -f
                exit 0
              fi

              sleep 5
            done

            echo " App is unhealthy"
            # Revertir al contenedor anterior
            sed -i "s|image: papopapota/jobs-api:.*|image: $PREVIOUS_IMAGE|" docker-compose.yml
            docker compose up -d 
            
            exit 1
      